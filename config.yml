# Seconds the core may be out of the owner's inventory before the curse hits
grace-seconds: 5

# When a hardcore player dies, lightning strikes their death spot and they are kicked.
# false = harmless visual lightning, true = real lightning (can set fires, burns items)
hardcore-lightning-real: false
# Delay between the death and the lightning, in ticks (10 ticks = 0.5 seconds)
hardcore-lightning-delay-ticks: 10
# Delay before the kick, in ticks (20 ticks = 1 second)
hardcore-kick-delay-ticks: 20
# Hardcore players are only kicked, never banned: they can rejoin right away (still hardcore).
# Black, jolting hearts for hardcore players (hidden Wither + Regeneration, their damage/healing is cancelled)
hardcore-black-hearts: true

# Beacon-deactivate sound when a core is destroyed: ALL (every player), OWNER, or NONE
core-destroyed-sound: ALL

# true = when a non-op player logs off, they are fully reset (same as /core clear).
# Not applied when the whole server stops or restarts.
clear-on-logoff: true

# ---- Revive Totem (/special give revivetotem <playername>)
# true = the revived player is set to normal and gets a fresh core (hardcore/curse lifted)
revive-sets-normal: true
# Seconds the beacon stays up if the revived player never steps off it (or logs off)
revive-timeout-seconds: 300
# How long the beacon takes to crumble away, in seconds
crumble-seconds: 15

# What happens when a player dies carrying their core.
#   DROP     = the core drops where they died, like any other item. They are cursed
#              after the grace time unless they get it back (default)
#   HARDCORE = the core vanishes and counts as destroyed (player becomes hardcore)
#   KEEP     = the core comes back with them when they respawn
#   NOTHING  = the core vanishes and they get the curse after the grace time
death-with-core: DROP

# /core reroll <players> picks one outcome per player using these weights:
#   normal   = core in their inventory
#   cursed   = no core at all, and they are cursed
#   hardcore = no core at all, and they are hardcore
# Equal numbers = a pure 1 in 3 chance each, rolled separately for every player.
randomize:
  normal: 1
  cursed: 1
  hardcore: 1

# false = players with no core/status (never given one, or cleared) keep the default white name.
# true  = they show the normal colour (green) instead.
color-untouched-players: false

# Nametag colours (tab list, chat and above the head).
# Any Minecraft colour name: green, red, black, dark_red, gold, aqua, ...
colors:
  normal: green
  cursed: red
  hardcore: black

# Random curse settings (potion effects that last until the core returns)
curse:
  # allowed: weakness, blindness, slowness, mining_fatigue, nausea, hunger, poison, darkness, unluck
  effects:
    - weakness
    - blindness
    - slowness
    - mining_fatigue
    - nausea
    - hunger
    - darkness
    - unluck
  # A cursed player gets exactly ONE effect. Blindness is this many percentage points
  # less likely than an equal share (with 8 effects: 12.5% -> 7.5%). 0 = no penalty.
  blindness-penalty: 5
  # 1 means levels I and II can roll, 0 means only level I
  max-amplifier: 1

# Items that can NOT be rolled as a random core.
# (/core set <item> can still use them, except air)
blacklist:
  - BARRIER
  - LIGHT
  - STRUCTURE_VOID
  - STRUCTURE_BLOCK
  - JIGSAW
  - COMMAND_BLOCK
  - CHAIN_COMMAND_BLOCK
  - REPEATING_COMMAND_BLOCK
  - COMMAND_BLOCK_MINECART
  - DEBUG_STICK
  - KNOWLEDGE_BOOK
  - SPAWNER
  - TRIAL_SPAWNER
  - VAULT
  - REINFORCED_DEEPSLATE
  - BEDROCK
  - END_PORTAL_FRAME
  - PETRIFIED_OAK_SLAB
  - FARMLAND
  - DIRT_PATH
  - CHORUS_PLANT
  - BUDDING_AMETHYST
  - FROGSPAWN
  - TEST_BLOCK
  - TEST_INSTANCE_BLOCK
